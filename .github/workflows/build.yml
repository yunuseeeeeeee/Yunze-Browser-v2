name: Build Yunze Browser APK (zip'ten)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kodu al
        uses: actions/checkout@v4

      - name: Zip dosyasını bul ve aç
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIPFILE" ]; then
            echo "HATA: Repo kökünde .zip dosyası bulunamadı!"
            exit 1
          fi
          echo "Bulunan zip: $ZIPFILE"
          unzip -o "$ZIPFILE" -d project
          echo "--- project içeriği ---"
          ls -la project

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK derle
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Debug APK'yı yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: yunze-browser-debug
          path: project/app/build/outputs/apk/debug/*.apk

      - name: Release APK derle (imzasız)
        working-directory: project
        run: gradle assembleRelease --stacktrace

      - name: Release APK'yı yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: yunze-browser-release-unsigned
          path: project/app/build/outputs/apk/release/*.apk
